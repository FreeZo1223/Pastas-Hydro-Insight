# data_sources.yaml — Centrale registry van Nederlandse geo-services
#
# Hernoemd van services.yaml (geo_stack standalone) → data_sources.yaml (lesa-agent-v2).
# Dit bestand is de enige plek waar endpoints en versie-metadata worden bijgehouden.
# Code (discovery.py, cloud_native.py) laadt dit bestand; geen endpoints in business-logica.
#
# Velden per entry:
#   endpoint:        URL van de service
#   service_type:    WFS | WCS | WMS | STAC | REST | CLOUD_NATIVE
#   source_version:  Versielabel voor provenance.json
#   update_cadence:  Hoe vaak bijgewerkt
#   cql_filter:      true als CQL_FILTER daadwerkelijk werkt (niet tile-cached)
#   warning:         Bekende beperkingen

services:

  # ── BGT ────────────────────────────────────────────────────────────────────
  bgt:
    - label: BGT WFS
      endpoint: "https://service.pdok.nl/lv/bgt/wfs/v1_0"
      service_type: WFS
      source_version: "BGT 2025-Q1"
      update_cadence: dagelijks
      cql_filter: true
      default_crs: "EPSG:28992"
      feature_types:
        - bgt:begroeidterreindeel
        - bgt:onbegroeidterreindeel
        - bgt:ondersteunendwaterdeel
        - bgt:ondersteunendwegdeel
        - bgt:overbruggingsdeel
        - bgt:overigbouwwerk
        - bgt:pand
        - bgt:scheiding
        - bgt:tunneldeel
        - bgt:vegetatieobject
        - bgt:waterdeel
        - bgt:wegdeel

  # ── AHN ────────────────────────────────────────────────────────────────────
  ahn:
    - label: AHN4 WCS (PDOK)
      endpoint: "https://service.pdok.nl/rws/actueel-hoogtebestand-nederland/wcs/v1_0"
      service_type: WCS
      source_version: "AHN4"
      update_cadence: eenmalig
      default_crs: "EPSG:28992"
      coverages:
        dsm_05m: DSM 0.5m resolutie (downsample via WCS scaleSize voor lagere outputs)
        dtm_05m: DTM 0.5m resolutie (downsample via WCS scaleSize voor lagere outputs)
      warning: "WCS-limiet ~5000×5000 px per request; bij grotere AOIs → gebruik COG-modus"
    - label: AHN4 COG (PDOK OGC API, cloud-native)
      endpoint: "https://api.pdok.nl/rws/ahn/ogc/v1_0"
      service_type: CLOUD_NATIVE
      source_version: "AHN4"
      update_cadence: eenmalig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.ahn.fetch_ahn_cog"
      collections:
        dtm_05m: DTM 0.5m (cloud-native COG tiles)
        dsm_05m: DSM 0.5m (cloud-native COG tiles)
      note: |
        Geen grootte-limiet. Gebruikt rasterio /vsicurl/ om tiles on-the-fly te lezen
        en samen te voegen. Vereist: rasterio met GDAL VSIcurl-ondersteuning.
        Automatisch ingeschakeld door fetch_ahn_tile(fetch_method='auto') bij grote AOIs.

  # ── Luchtfoto (PDOK Beeldmateriaal HWH) ───────────────────────────────────
  luchtfoto:
    - label: Luchtfoto RGB (PDOK HWH ortho)
      endpoint: "https://service.pdok.nl/hwh/luchtfotorgb/wms/v1_0"
      service_type: WMS
      source_version: "Beeldmateriaal Actueel (RGB)"
      update_cadence: jaarlijks
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.luchtfoto.fetch_luchtfoto"
      layers:
        Actueel_orthoHR: 8cm RGB ortho (hoogste resolutie)
        Actueel_ortho25: 25cm RGB ortho
      note: "Jaarlagen ook beschikbaar: 2017_… t/m 2026_orthoHR / _ortho25."
    - label: Luchtfoto CIR / kleureninfrarood (PDOK HWH ortho)
      endpoint: "https://service.pdok.nl/hwh/luchtfotocir/wms/v1_0"
      service_type: WMS
      source_version: "Beeldmateriaal Actueel (CIR)"
      update_cadence: jaarlijks
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.luchtfoto.fetch_luchtfoto"
      layers:
        Actueel_orthoHRIR: 8cm kleureninfrarood (kanaal1=NIR, 2=rood, 3=groen)
        Actueel_ortho25IR: 25cm kleureninfrarood
      note: |
        False-color CIR: band1=NIR, band2=rood, band3=groen. Pseudo-NDVI =
        (NIR-rood)/(NIR+rood). DN-waarden (0-255), geen gekalibreerde reflectie;
        drempel visueel ijken. WMS-limiet ~4000px/request → skill tegelt automatisch.

  # ── BRO — Bodem, Geomorfologie, REGIS ─────────────────────────────────────
  bro_bodemkaart:
    - label: BRO Bodemkaart WFS (WUR/BIS Nederland)
      endpoint: "https://maps.bodemdata.nl/geoserver/wfs"
      service_type: WFS
      source_version: "BRO Bodemkaart 1:50000 v2025 (WUR/BIS Nederland)"
      update_cadence: onregelmatig
      cql_filter: true
      default_crs: "EPSG:28992"
      typename: "bodem:Bodemkaart50000_v2025"
      module: "geo_stack.skills.bro.bodemkaart.fetch_bodemkaart"
      note: |
        Sinds eind 2025 gehost door WUR/BIS Nederland op maps.bodemdata.nl,
        niet meer via PDOK. Typename: bodem:Bodemkaart50000_v2025.
        Bevat bodemtype, grondwatertrap (Gt), bodemhorizont.

  bro_geomorfologie:
    - label: BRO Geomorfologische kaart WFS
      endpoint: "https://service.pdok.nl/bzk/basisregistratieondergrond/wfs/v1_0"
      service_type: WFS
      source_version: "BRO Geomorfologische kaart"
      update_cadence: onregelmatig
      cql_filter: true
      default_crs: "EPSG:28992"

  bro_grondwater:
    - label: BRO Grondwaterspiegeldiepte WCS (GHG/GLG/GVG raster)
      endpoint: "https://service.pdok.nl/bzk/bro-grondwaterspiegeldiepte/wcs/v1_0"
      service_type: WCS
      source_version: "BRO grondwaterspiegeldiepte"
      update_cadence: onregelmatig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.bro_grondwater.fetch_grondwaterstand"
      products:
        GHG: Gemiddelde Hoogste Grondwaterstand (cm onder maaiveld)
        GLG: Gemiddelde Laagste Grondwaterstand (cm onder maaiveld)
        GVG: Gemiddelde Voorjaarsgrondwaterstand (cm onder maaiveld)
      note: |
        Geïnterpoleerd uit BRO-peilbuismetingen — onzekerheid hoger in gebieden
        zonder dichtbij gelegen peilbuizen. Combineer met fetch_peilbuizen()
        om meetdichtheid zichtbaar te maken.
    - label: BRO GMW peilbuispunten (REST, BRO publiek)
      endpoint: "https://publiek.broservices.nl/gm/gmw/v1/characteristics/searches"
      service_type: REST
      source_version: "BRO GMW (publiek)"
      update_cadence: continu
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.bro_grondwater.fetch_peilbuizen"
      note: |
        Oude PDOK WFS-endpoint is eind 2025 uitgezet. Werkende route is BRO
        publieke REST (POST JSON + XML-respons). Tijdreeksen apart per GLD-id.

  # ── Natura 2000 ────────────────────────────────────────────────────────────
  natura2000:
    - label: Natura 2000 WFS (RVO)
      endpoint: "https://service.pdok.nl/rvo/natura2000/wfs/v1_0"
      service_type: WFS
      source_version: "Natura 2000 NL 2024"
      update_cadence: onregelmatig
      cql_filter: true
      default_crs: "EPSG:28992"

  # ── BRP Gewaspercelen ──────────────────────────────────────────────────────
  brp:
    - label: BRP Gewaspercelen 2024 WFS
      endpoint: "https://service.pdok.nl/rvo/brpgewaspercelen/wfs/v1_0"
      service_type: WFS
      source_version: "BRP 2024"
      update_cadence: jaarlijks
      cql_filter: true
      default_crs: "EPSG:28992"
      typename: "BrpGewas"
      module: "geo_stack.skills.wfs_generic.fetch_wfs"
      generic: true
      note: "B11/C4 — filter op jaar=2024 via CQL_FILTER werkt bij RVO (niet tile-cached). Geef desgewenst typename/cql_filter mee."

  # ── Topotijdreis ───────────────────────────────────────────────────────────
  topotijdreis:
    - label: Topotijdreis WMTS (BRT historisch)
      endpoint: "https://services.pdok.nl/brt/topotijdreis/wmts/v1_0"
      service_type: WMS
      source_version: "Topotijdreis 1815–heden"
      update_cadence: onregelmatig
      note: "Registreer als .qlr in QGIS — geen vectordownload"

  # ── Locatieserver — geocoding adres/plaats/BAG/BRK ────────────────────────
  locatieserver:
    - label: PDOK Locatieserver (free search)
      endpoint: "https://api.pdok.nl/bzk/locatieserver/search/v3_1/free"
      service_type: REST
      source_version: "BAG + BRK (vorige kalenderdag)"
      update_cadence: dagelijks
      auth_required: false
      module: "geo_stack.skills.locatieserver.geocode"
      supported_types:
        - adres
        - gemeente
        - woonplaats
        - weg
        - postcode
        - perceel
        - hectometer
        - buurt
        - wijk
        - waterschapsgebied
        - provincie
        - appartement
      note: |
        Filter via parameter ``fq=type:<type>``. Resultaten bevatten zowel
        ``centroide_rd`` (snel) als optioneel ``geometrie_rd`` via lookup-call.
        Max 100 rows per request.
    - label: PDOK Locatieserver (lookup per id)
      endpoint: "https://api.pdok.nl/bzk/locatieserver/search/v3_1/lookup"
      service_type: REST
      source_version: "BAG + BRK (vorige kalenderdag)"
      update_cadence: dagelijks
      note: "Gebruikt door geocode(full_geometry=True) om polygonen op te halen"

  # ── Kadaster / BRK ─────────────────────────────────────────────────────────
  kadaster:
    - label: BRK Kadastrale Kaart WFS
      endpoint: "https://service.pdok.nl/kadaster/kadastralekaart/wfs/v5_0"
      service_type: WFS
      source_version: "BRK 2025-Q1"
      update_cadence: dagelijks
      cql_filter: false
      warning: "tile-cached — CQL_FILTER wordt stil genegeerd; gebruik BBOX + client-side filter"

    - label: PDOK Locatieserver (percelen + geocoding)
      endpoint: "https://api.pdok.nl/bzk/locatieserver/search/v3_1"
      service_type: REST
      source_version: "DKK vorige kalenderdag"
      update_cadence: dagelijks

  # ── 3DBAG ──────────────────────────────────────────────────────────────────
  bag_3d:
    - label: 3DBAG GPKG (cloud-native)
      service_type: CLOUD_NATIVE
      source_version: "3DBAG v20250903"
      update_cadence: per release (~kwartaal)
      cloud_native_url: "https://data.3dbag.nl/v20250903/3dbag_nl.gpkg.zip"
      internal_file: "3dbag_nl.gpkg"
      layers:
        - lod22_2d
        - pand

  # ── BAG ────────────────────────────────────────────────────────────────────
  bag:
    - label: BAG Light GPKG (cloud-native)
      service_type: CLOUD_NATIVE
      source_version: "BAG 2025-Q1"
      update_cadence: maandelijks
      cloud_native_url: "https://service.pdok.nl/lv/bag/atom/v1_0/downloads/bag-light.gpkg"
      layers:
        - verblijfsobject
        - pand
        - nummeraanduiding
        - openbareruimte
        - woonplaats

  # ── CBS ────────────────────────────────────────────────────────────────────
  cbs:
    - label: CBS Wijken en Buurten WFS
      endpoint: "https://service.pdok.nl/cbs/wijkenbuurten/2024/wfs/v1_0"
      service_type: WFS
      source_version: "CBS 2024"
      update_cadence: jaarlijks
      cql_filter: false
      warning: "Filter niet werkend — download alle gemeenten, filter lokaal op statnaam"

  # ── TOP10NL ────────────────────────────────────────────────────────────────
  top10nl:
    - label: BRT TOP10NL WFS
      endpoint: "https://service.pdok.nl/brt/top10nl/wfs/v1_0"
      service_type: WFS
      source_version: "BRT TOP10NL 2025-Q1"
      update_cadence: kwartaal
      cql_filter: true
      default_crs: "EPSG:28992"

  # ── NDVI / Sentinel-2 (STAC) ──────────────────────────────────────────────
  ndvi:
    - label: Element84 Earth Search (Sentinel-2 L2A)
      endpoint: "https://earth-search.aws.element84.com/v1"
      service_type: STAC
      collection: "sentinel-2-l2a"
      source_version: "Sentinel-2 L2A (ESA)"
      update_cadence: continu

    - label: Microsoft Planetary Computer
      endpoint: "https://planetarycomputer.microsoft.com/api/stac/v1"
      service_type: STAC
      collection: "sentinel-2-l2a"
      source_version: "Sentinel-2 L2A (ESA)"
      update_cadence: continu

  # ── KNMI (Klimatologie) ────────────────────────────────────────────────────
  knmi:
    - label: KNMI dagwaarden
      endpoint: "https://daggegevens.knmi.nl/klimatologie/daggegevens"
      service_type: REST
      source_version: "KNMI dagwaarden v2"
      update_cadence: dagelijks
      auth_required: false
      module: "geo_stack.skills.knmi.fetch_knmi_dagwaarden"
      variables:
        RD: "Neerslag (0.1 mm/dag, -1 = ontbrekend)"
        EV24: "Makkink referentiegewasverdamping (0.1 mm/dag)"
      note: |
        Klimaatstations leveren RD + EV24; neerslagstations alleen RD.
        Voor PASTAS RechargeModel: kies klimaatstation dichtbij de AOI.

  # ── BRO Grondwatermonitoring (peilbuizen + tijdreeksen) ───────────────────
  bro_peilbuizen:
    - label: BRO GMW peilbuispunten (WFS)
      endpoint: "https://service.pdok.nl/bzk/bro-grondwaterstandonderzoek/wfs/v1_0"
      service_type: WFS
      source_version: "BRO GMW"
      update_cadence: dagelijks
      default_crs: "EPSG:28992"
      typename: "gld:Monitoringwell"
      module: "geo_stack.skills.bro.peilbuizen.fetch_peilbuizen"
    - label: BRO GLD tijdreeksen (REST per id)
      endpoint: "https://publiek.broservices.nl/gm/gld/v1/objects/{gld_id}"
      service_type: REST
      source_version: "BRO GLD v1"
      update_cadence: dagelijks
      module: "geo_stack.skills.bro.peilbuizen.fetch_gld_timeseries"
      note: |
        XML-respons; geen WFS. Filter via tmin/tmax client-side.
        Voor productie-pipelines: overweeg ``hydropandas`` als wrapper.

  # ── FGR (Fysisch-geografische regio's) ─────────────────────────────────────
  fgr:
    - label: FGR WMS (register als .qlr)
      endpoint: "https://service.pdok.nl/rvo/fgr/wms/v1_0"
      service_type: WMS
      source_version: "FGR 2020"
      update_cadence: onbekend
      note: "Niet downloaden — registreer als .qlr referentie"
    - label: FGR WFS (vectordownload, gebruikt door landschapsleutel-skill)
      endpoint: "https://service.pdok.nl/rvo/fgr/wfs/v1_0"
      service_type: WFS
      source_version: "FGR 2020"
      update_cadence: onbekend
      default_crs: "EPSG:28992"
      typename: "fgr:FysischGeografischeRegio"
      module: "geo_stack.skills.landschapsleutel.classify_landscape"
      note: |
        Parallel WFS naast de WMS. Wordt door classify_landscape gecombineerd
        met BRO Bodemkaart 1:50.000 voor een benadering van de Landschapssleutel.
        Endpoint overrideable via parameter fgr_endpoint.

  # ── Landschapssleutel (benadering via FGR + bodemkaart) ───────────────────
  landschapsleutel:
    - label: FGR + BRO Bodemkaart (classify_landscape)
      service_type: COMPOSITE
      source_version: "FGR 2020 + BRO Bodemkaart 1:50.000 v2025"
      update_cadence: onregelmatig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.landschapsleutel.classify_landscape"
      sources:
        fgr: "https://service.pdok.nl/rvo/fgr/wfs/v1_0"
        bodemkaart: "https://maps.bodemdata.nl/geoserver/wfs"
      output_columns:
        - fgr_regio
        - fgr_sectie
        - fgr_serie
        - bodemtype
        - gt_klasse
      note: |
        Benadering van de WUR Landschapssleutel (2014) op basis van twee
        publieke GIS-lagen: FGR-regio's + BRO bodemtype/grondwatertrap.
        De volledige Landschapssleutel integreert ook reliëf, hydrologische
        context en historisch landgebruik — gebruik deze module als eerste
        schets, niet als definitieve classificatie.

  # ── GEE (Google Earth Engine) ──────────────────────────────────────────────
  gee:
    - label: AlphaEarth Satellite Embeddings (annual, 64-band)
      endpoint: "GOOGLE/SATELLITE_EMBEDDING/V1/ANNUAL"
      service_type: GEE
      source_version: "V1 (Google/DeepMind)"
      update_cadence: jaarlijks
      bands: 64
      resolution_m: 10
      output_crs: "EPSG:32631"
      auth_required: true
      auth_methods:
        - "user: earthengine authenticate (interactief)"
        - "service_account: ee.ServiceAccountCredentials(key_file=...)"
      module: "geo_stack.skills.gee.fetch_alpha_earth"
      note: |
        Skipt Google Drive — gebruikt ee.data.computePixels in tegels.

  # ══ BKN-bronnen ════════════════════════════════════════════════════════════
  # Toegevoegd voor de Basiskwaliteit Natuur-pipeline (BKN_projecten). Voorheen
  # hardcoded in pipeline/src/reference/condities_bronnen.json — nu via geo_stack
  # met retry + cache + provenance. Generieke fetchers (service_type bepaalt de
  # route in fetch.py): WFS → wfs_generic, WMS → wms_raster, ARCGIS_REST →
  # arcgis_rest. Een nieuwe gelijksoortige bron = alleen een entry hier, geen code.

  # ── AtlasNK (Atlas Natuurlijk Kapitaal) — styled WMS-lagen ─────────────────
  atlasnk:
    - label: AtlasNK GeoServer WMS (styled rasterlagen)
      endpoint: "https://geo.atlasnatuurlijkkapitaal.nl/geoserver/ows"
      service_type: WMS
      source_version: "AtlasNK (RIVM)"
      update_cadence: onregelmatig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.wms_raster.fetch_wms_raster"
      generic: true
      layers:
        groenkaart_lage_vegetatie: "B2 — % lage vegetatie per 100m grid"
        groenkaart_struiken: "B5 — struiklaag"
        groenkaart_bomen: "B6 — boomkroon"
        groenkaart_bomenhoogte: "B6 — bomenhoogte"
        lichtemissie_nacht: "A7 — lichtemissie (proxy donkerte)"
        geluid_lden: "A8 — geluid Lden"
        toxische_druk_bodem: "A2 — mengsel toxische druk bodem"
        toxische_druk_water: "A6 — mengsel toxische druk water"
        soortendiversiteit: "B11 — soortendiversiteit"
        ecologisch_kapitaal_bodem: "A1/B8 — ecologisch kapitaal bodem"
        ecosysteemtypen: "ecosysteemtypenkaart"
      warning: |
        Styled WMS = gerenderd beeld, geen meetwaarde → PROXY. Laagnamen
        indicatief; verifieer via GetCapabilities (geo.atlasnatuurlijkkapitaal.nl/
        geoserver/ows?SERVICE=WMS&REQUEST=GetCapabilities). Geef de exacte laag
        mee via kwarg ``layer=``.

  # ── NHI grondwater (Nationaal Hydrologisch Instrumentarium) — WMS ──────────
  nhi:
    - label: NHI grondwater WMS (GHG/GLG modeluitvoer)
      endpoint: "https://service.pdok.nl/rws/nhi/wms/v1_0"
      service_type: WMS
      source_version: "NHI"
      update_cadence: onregelmatig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.wms_raster.fetch_wms_raster"
      generic: true
      note: "B14 — GHG/GLG modeluitvoer ~250m. Geef ``layer=`` mee."

  # ── RIVM nachtlicht (Atlas Leefomgeving) — WMS ─────────────────────────────
  rivm_nachtlicht:
    - label: Atlas Leefomgeving — Nachtelijk licht (VIIRS) WMS
      endpoint: "https://geodata.rivm.nl/arcgis/rest/services/Atlas_Leefomgeving/Nachtelijk_licht/MapServer/WMSServer"
      service_type: WMS
      source_version: "VIIRS via RIVM"
      update_cadence: onregelmatig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.wms_raster.fetch_wms_raster"
      generic: true
      warning: "A7 — RIVM-endpoint was tijdelijk 503/404 in Alkmaar-run; verifieer bereikbaarheid. Fallback: atlasnk lichtemissie_nacht."

  # ── Bodemloket (RIVM/BIS) — WMS ────────────────────────────────────────────
  bodemloket:
    - label: Bodemloket WMS (bekende verontreinigingslocaties)
      endpoint: "https://service.pdok.nl/rivm/bodemloket/wms/v1_0"
      service_type: WMS
      source_version: "Bodemloket"
      update_cadence: onregelmatig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.wms_raster.fetch_wms_raster"
      generic: true
      note: "A2 — alleen onderzochte locaties; ononderzocht ≠ schoon. Geef ``layer=`` mee."

  # ── BAG panden — WFS (vector; aanvulling op cloud-native bag) ──────────────
  bag_wfs:
    - label: BAG WFS v2 (panden, vector)
      endpoint: "https://service.pdok.nl/lv/bag/wfs/v2_0"
      service_type: WFS
      source_version: "BAG"
      update_cadence: dagelijks
      cql_filter: true
      default_crs: "EPSG:28992"
      typename: "bag:pand"
      module: "geo_stack.skills.wfs_generic.fetch_wfs"
      generic: true
      note: "B7 — bouwjaar + footprint; hoogte via AHN4-overlay. Voor bulk: gebruik cloud-native ``bag``."

  # ── Monumentale bomen (RCE) — WFS ──────────────────────────────────────────
  monumentale_bomen:
    - label: Monumentale Bomen NL (RCE) WFS
      endpoint: "https://service.pdok.nl/rce/monumentale-bomen/wfs/v1_0"
      service_type: WFS
      source_version: "RCE Monumentale Bomen"
      update_cadence: onregelmatig
      cql_filter: true
      default_crs: "EPSG:28992"
      typename: "monumentale-bomen:monumentale_boom"
      module: "geo_stack.skills.wfs_generic.fetch_wfs"
      generic: true
      note: "B12 — vrijwillige registratie; ondervertegenwoordiging mogelijk."

  # ── ANLb subsidiegebieden (RVO) — WFS ──────────────────────────────────────
  anlb:
    - label: ANLb subsidiegebieden (RVO) WFS
      endpoint: "https://service.pdok.nl/rvo/anlb/wfs/v1_0"
      service_type: WFS
      source_version: "ANLb"
      update_cadence: jaarlijks
      cql_filter: true
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.wfs_generic.fetch_wfs"
      generic: true
      note: "C1/C4 — agrarisch natuur- en landschapsbeheer. Geef ``typename=`` mee (verifieer via GetCapabilities)."

  # ── NNN (Natuurnetwerk Nederland, BIJ12) — WFS ─────────────────────────────
  nnn:
    - label: Natuurnetwerk Nederland (BIJ12) WFS
      endpoint: "https://service.pdok.nl/bij12/natuurnetwerknederland/wfs/v1_0"
      service_type: WFS
      source_version: "NNN (BIJ12)"
      update_cadence: onregelmatig
      cql_filter: true
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.wfs_generic.fetch_wfs"
      generic: true
      note: "Beleidslaag — overlap gemeentegrens. Geef ``typename=`` mee."

  # ── HHNK leggers — ArcGIS REST (publiek, zonder inlog) ─────────────────────
  hhnk_oevers:
    - label: HHNK legger — oevers en bergingsgebieden (ArcGIS REST)
      endpoint: "https://kaarten.hhnk.nl/arcgis/rest/services/od_legger/od_legger_wateren_2025_oevers_en_bergingsgebieden_vg/MapServer"
      service_type: ARCGIS_REST
      source_version: "HHNK legger 2025"
      update_cadence: onregelmatig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.arcgis_rest.fetch_arcgis"
      generic: true
      layers:
        1: "Natuurvriendelijke oever en rietoever derden (vastgesteld)"
        2: "Rietoever HHNK (vastgesteld)"
        3: "Natuurvriendelijke oever HHNK (vastgesteld)"
        4: "Bergingsgebieden (vastgesteld)"
      note: "B9 — directe NVO-meting (vervangt proxy). Geef ``layer_id=`` mee. Waterschap-specifiek (alleen HHNK-werkgebied)."

  hhnk_oppervlaktewateren:
    - label: HHNK legger — oppervlaktewateren (ArcGIS REST)
      endpoint: "https://kaarten.hhnk.nl/arcgis/rest/services/od_legger/od_legger_wateren_2025_oppervlaktewateren_vg/MapServer"
      service_type: ARCGIS_REST
      source_version: "HHNK legger 2025"
      update_cadence: onregelmatig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.arcgis_rest.fetch_arcgis"
      generic: true
      layers:
        0: "Waterlopen per categorie (vastgesteld)"
        1: "Waterlopen onderhoudsplichtigen (vastgesteld)"
        2: "Waterlopen maximale begroeiingsgraad (vastgesteld)"
      note: "B10 — categorisering waterlopen/poelen. Geef ``layer_id=`` mee."

  # ── Bronnen zonder generieke fetcher — bespoke REST (nog handmatig) ────────
  # Geregistreerd voor vindbaarheid + provenance; eigen schema vereist een
  # dedicated skill. Niet hand-rollen zonder noodzaak (anti-verzin-doctrine).
  waterkwaliteitsportaal:
    - label: Waterkwaliteitsportaal (KRW-meetpunten)
      endpoint: "https://www.waterkwaliteitsportaal.nl/oppervlaktewaterkwaliteit/api/v1"
      service_type: REST
      source_version: "Waterkwaliteitsportaal"
      update_cadence: onregelmatig
      auth_required: false
      generic: false
      warning: |
        A4/A5/A6 — bespoke JSON-API, GEEN generieke fetcher. URL was deels dood
        in eerdere BKN-run → verifieer bereikbaarheid eerst. Vereist dedicated
        skill (EKR/nutriënten per waterlichaam). Tot dan: HANDMATIG.

  ep_online:
    - label: EP-Online energielabels (RVO)
      endpoint: "https://public.ep-online.nl/api/v4"
      service_type: REST
      source_version: "EP-Online v4"
      update_cadence: continu
      auth_required: true
      generic: false
      warning: |
        B7 — vereist API-key (RVO). Bespoke schema; geen generieke fetcher.
        Label A/B ≈ geïsoleerd = minder verblijfplaatsen. Tot dedicated skill:
        HANDMATIG met gedocumenteerde key.

  # ── LGN (Landelijk Grondgebruik Nederland) — WMS + lokaal raster ───────────
  lgn:
    - label: LGN WMS (PDOK/WUR)
      endpoint: "https://service.pdok.nl/wur/lgn/wms/v1_0"
      service_type: WMS
      source_version: "LGN2024"
      update_cadence: jaarlijks
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.lgn.clip_lgn"
      layers:
        lgn: "LGN landgebruiksraster (klassen 1-45)"
      note: |
        Primaire route: lokaal bestand C:\GIS_Projecten\BKN_projecten\data_groot\LGN2024\LGN2024.tif
        (clip_lgn gebruikt dit bij voorkeur). WMS als fallback voor visualisatie.
        Gebruik lgn_reclass (geo_stack.skills.lgn_reclass.apply_reclass) voor omzetting
        naar ConScape quality/affinity matrices. Resolutie: 25m.

  # ── LASREG (Landschapselementen Register, WUR/NEO) ─────────────────────────
  lasreg:
    - label: LASREG GeoPackage download (WUR/NEO)
      endpoint: "https://lasreg.containers.wur.nl"
      service_type: REST
      source_version: "LASREG 2023"
      update_cadence: jaarlijks
      auth_required: false
      license: "CC-BY 4.0"
      module: "geo_stack.skills.wfs_generic.fetch_wfs"
      generic: false
      note: |
        B1/B3/B13 — Landschapselementen (heggen, houtwallen, poelen, etc.)
        Download per gemeente als GeoPackage via portal; geen WFS/API-access.
        Registratie op portaal vereist. Laagnamen: groene_elementen, blauwe_elementen.
        HANDMATIG: download via lasreg.containers.wur.nl → sla op als
        cache/lasreg/{gemeente_code}_lasreg.gpkg.
        Waterschap-specifieke legger (hhnk_oppervlaktewateren) is alternatief voor B10.

  # ── HHNK KRW waterkwaliteit — ArcGIS REST ──────────────────────────────────
  hhnk_krw_kwaliteit:
    - label: HHNK KRW waterkwaliteit oordeel (ArcGIS REST)
      endpoint: "https://kaarten.hhnk.nl/arcgis/rest/services/WBP/wbp_krw_waterkwaliteit_oordeel/MapServer"
      service_type: ARCGIS_REST
      source_version: "HHNK KRW WBP"
      update_cadence: onregelmatig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.arcgis_rest.fetch_arcgis"
      generic: true
      layers:
        0: "NTOT — totaal stikstof oordeel (A5)"
        3: "PTOT — totaal fosfor oordeel (A4)"
        7: "MAFAUNA — macrofauna oordeel (A5 biologie)"
        10: "OVWFLORA — overige waterflora oordeel (A4/A5)"
      note: "A4/A5 — EKR-oordelen per KRW-waterlichaam. Geef ``layer_id=`` mee. Waterschap-specifiek (HHNK-werkgebied)."

  # ── HHNK peilgebieden — ArcGIS REST (bevestigd werkend 2026-06-02) ──────────
  hhnk_peilgebieden:
    - label: HHNK peilgebieden (ArcGIS REST)
      endpoint: "https://kaarten.hhnk.nl/arcgis/rest/services/ws/WS_Peilgebieden/MapServer"
      service_type: ARCGIS_REST
      source_version: "HHNK peilbeheer"
      update_cadence: onregelmatig
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.arcgis_rest.fetch_arcgis"
      generic: true
      layers:
        0: "Peilgebieden (vastgesteld streefpeil)"
      note: "B14 — streefpeilen per peilgebied. Werkend bevonden 2026-06-02. Waterschap-specifiek (HHNK)."

  # ── HHNK GeoServer — WFS (legger + KRW waterlichamen) ──────────────────────
  hhnk_geoserver:
    - label: HHNK GeoServer WFS
      endpoint: "https://geoservices.hhnk.nl/geoserver/hhnk/ows"
      service_type: WFS
      source_version: "HHNK GeoServer"
      update_cadence: onregelmatig
      cql_filter: true
      default_crs: "EPSG:28992"
      module: "geo_stack.skills.wfs_generic.fetch_wfs"
      generic: true
      feature_types:
        - hhnk:legger_watergangen
        - hhnk:oppervlaktewater
        - hhnk:krw_waterlichamen
      note: |
        B10/B14 — legger watergangen + KRW waterlichamen. Geef ``typename=`` mee.
        Waterschap-specifiek (HHNK-werkgebied). Fallback als arcgis-legger niet
        werkt. krw_waterlichamen = polygonen; legger_watergangen = lijnen.

  # ── KRW landelijk — Rijkswaterstaat GeoServer WFS ──────────────────────────
  krw_landelijk:
    - label: KRW oppervlaktewaterlichamen NL (Rijkswaterstaat GeoServer)
      endpoint: "https://geoservices.rijkswaterstaat.nl/apps/geoserver/ows"
      service_type: WFS
      source_version: "KRW NL"
      update_cadence: onregelmatig
      cql_filter: true
      default_crs: "EPSG:28992"
      typename: "rws:krw_oppervlaktewaterlichamen_vlak"
      module: "geo_stack.skills.wfs_generic.fetch_wfs"
      generic: true
      note: "A4/A5/B10 — landsdekkende KRW-waterlichamen als vlakken. Gebruik als fallback als HHNK-specifieke bron ontbreekt."

  # ── KRW meetpunten — PDOK INSPIRE Atom ────────────────────────────────────
  krw_meetpunten:
    - label: KRW monitoring locaties geharmoniseerd (PDOK INSPIRE Atom)
      endpoint: "https://service.pdok.nl/ihw/krw-monitoringlocaties-geharmoniseerd/atom/downloads/INSPIREMonitoringSite.gml"
      service_type: REST
      source_version: "KRW INSPIRE NL"
      update_cadence: jaarlijks
      auth_required: false
      generic: false
      note: |
        A4/A5 — INSPIRE GML download van alle KRW-meetpunten. Eenmalige bulk-download,
        dan client-side filteren op gemeente/waterlichaam. Combineer met
        waterkwaliteitsportaal voor meetwaarden per punt.
        Download als GML; converteer naar GeoPackage via ogr2ogr.

  # ── BeSI (Biodiversiteits Stimulerings Index) — lokale VRT ─────────────────
  besi:
    - label: BeSI landsdekkend raster (lokale VRT)
      service_type: LOCAL_RASTER
      source_version: "BeSI"
      update_cadence: onregelmatig
      local_path: "BeSI/BESI_Master.vrt"
      module: "geo_stack.skills.besi_fetcher.fetch_besi"
      default_crs: "EPSG:28992"
      note: |
        B11 — BeSI-score als biodiversiteitsindicator. Lokale VRT (virtual raster)
        die meerdere GeoTIFFs samenbindt; vereist dat de BeSI-bestanden aanwezig
        zijn in het werkpad (niet beschikbaar via publieke API).
        besi_fetcher.py implementeert de clip + statistieken per AOI.

  # ── NEO Boomstampositie BGT — REST API ─────────────────────────────────────
  neo_bomen:
    - label: NEO Boomstampositie BGT API (SignalEyes/NEO)
      endpoint: "https://boomstampositieBGT.signaleyes.nl"
      service_type: REST
      source_version: "NEO Boomstampositie BGT"
      update_cadence: onregelmatig
      auth_required: false
      license: "CC BY-NC-SA 4.0"
      generic: false
      note: |
        B6/B12 — individuele boomstamposities op basis van BGT vegetatieobjecten +
        puntenwolk-detectie (NEO/Cyclomedia). Bespoke REST-API; geen generieke
        WFS-fetcher beschikbaar. Geeft punten met diameter/hoogte-attributen.
        Let op licentie: BY-NC-SA (niet commercieel zonder toestemming).
        HANDMATIG of dedicated skill nodig voor bulk-aanvraag.

  # ── Waarneming.nl — REST API (biodiversiteitsregistraties) ─────────────────
  waarneming_nl:
    - label: Waarneming.nl observaties API
      endpoint: "https://waarneming.nl/api/v1/observations/"
      service_type: REST
      source_version: "Waarneming.nl v1"
      update_cadence: continu
      auth_required: false
      generic: false
      note: |
        B11/C3 — burgerwetenschapsdata (soortobservaties Nederland).
        Paginerende JSON-API; filter op taxon, datum, bbox.
        Geen officieel georeferenced dataverdrag → gebruik als aanvulling,
        niet als primaire bron voor MEET-status. Combineer met GBIF.

  # ── GBIF — REST API (biodiversiteitsregistraties, internationaal) ──────────
  gbif:
    - label: GBIF Occurrence API
      endpoint: "https://api.gbif.org/v1/occurrence/search"
      service_type: REST
      source_version: "GBIF v1"
      update_cadence: continu
      auth_required: false
      generic: false
      note: |
        B11/C3 — wereldwijde biodiversiteitsregistraties; NL-data via Naturalis/NDFF.
        Filter op country=NL, taxonKey, geometry (WKT). Paginerende JSON-API.
        Statusbeheersing: data bevat ook meldingen van buiten Nederland. Combineer
        met waarneming_nl voor completer beeld.

  # ── NDFF — handmatig (dataverdrag vereist) ────────────────────────────────
  ndff:
    - label: NDFF Flora en Fauna (Nationale Database Flora en Fauna)
      endpoint: "https://ndff.nl"
      service_type: REST
      source_version: "NDFF"
      update_cadence: continu
      auth_required: true
      generic: false
      warning: |
        B11 — vereist dataverdrag met NDFF (Naturalis/Sovon/etc.). Geen publieke API.
        HANDMATIG: exporteer data via NDFF-portaal na accordering dataverdrag.
        Bewaar als cache/ndff/{gemeente_code}_ndff_export.csv.
        Status: GEEN DATA tot dataverdrag beschikbaar.
