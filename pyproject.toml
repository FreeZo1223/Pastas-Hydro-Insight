[tool.uv.workspace]
members = [
    "pastas_adapter",
    "pastasdash",
]
# pastasdash_v2 is een zelfstandige app met een eigen pyproject.toml,
# .python-version en uv.lock. Als workspace-member zou uv de omgeving van deze
# root gebruiken en zijn eigen vastgelegde versies negeren; draai hem daarom
# vanuit zijn eigen map (`cd pastasdash_v2 && uv run pastasdash-v2`).
exclude = ["pastasdash_v2"]

[tool.uv.sources]
pastas-adapter = { workspace = true }
pastasdash     = { workspace = true }

[tool.uv]
prerelease = "allow"
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
markers = [
    "unit: unit tests (geen netwerk)",
    "integration: integration tests (netwerk vereist)",
]
