name: CI — geo_stack

on:
  push:
    branches: [main]
    paths:
      - "geo_stack/**"
      - ".github/workflows/ci-geo-stack.yml"
  pull_request:
    paths:
      - "geo_stack/**"
      - ".github/workflows/ci-geo-stack.yml"

jobs:
  lint-en-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install geo_stack + dev deps
        run: |
          pip install --upgrade pip
          pip install -e "geo_stack/[dev]"
          pip install ruff

      - name: Ruff lint
        run: |
          ruff check \
            --select=E9,F63,F7,F82 \
            --output-format=github \
            geo_stack/geo_stack/ geo_stack/tests/

      - name: Pytest unit tests
        run: |
          pytest geo_stack/tests/ -v -m unit --tb=short
